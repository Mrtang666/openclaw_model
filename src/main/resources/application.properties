# =========================
# Browser automation / Chrome DevTools MCP sidecar
# =========================
browser.automation.enabled=${BROWSER_AUTOMATION_ENABLED:false}
browser.automation.mcp-endpoint=${BROWSER_AUTOMATION_MCP_ENDPOINT:http://127.0.0.1:3333/mcp}
