spring.application.name=openclaw-cli
spring.config.import=optional:file:.env[.properties]
spring.main.web-application-type=servlet
spring.main.banner-mode=off
app.version=@project.version@
server.address=${WECHAT_LOGIN_SERVER_ADDRESS:127.0.0.1}
server.port=${WECHAT_LOGIN_SERVER_PORT:0}

# =========================
# Xiaohongshu web console
# =========================
xhs.console.enabled=${XHS_CONSOLE_ENABLED:true}
xhs.console.base-url=${XHS_CONSOLE_BASE_URL:}
xhs.console.auto-open=${XHS_CONSOLE_AUTO_OPEN:true}

# =========================
# WeChat login page
# =========================
wechat.login-page.base-url=${WECHAT_LOGIN_PAGE_BASE_URL:}
wechat.login-page.session-ttl=${WECHAT_LOGIN_SESSION_TTL:10m}

# =========================
# ClawBot multi-client and message concurrency
# =========================
clawbot.max-connections=${CLAWBOT_MAX_CONNECTIONS:10}
clawbot.max-pending-logins=${CLAWBOT_MAX_PENDING_LOGINS:3}
wechat.concurrency.worker-threads=${WECHAT_WORKER_THREADS:8}
wechat.concurrency.model-max-concurrency=${WECHAT_MODEL_MAX_CONCURRENCY:6}
wechat.concurrency.user-queue-capacity=${WECHAT_USER_QUEUE_CAPACITY:5}
wechat.concurrency.global-queue-capacity=${WECHAT_GLOBAL_QUEUE_CAPACITY:100}
wechat.concurrency.task-timeout=${WECHAT_TASK_TIMEOUT:180s}
wechat.concurrency.user-mailbox-idle=${WECHAT_USER_MAILBOX_IDLE:10m}

# =========================
# MySQL / Flyway
# =========================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/openclaw?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:6}
spring.task.scheduling.thread-name-prefix=openclaw-scheduler-
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# =========================
# Agent tool calling mode
# prompt-json      = legacy JSON planner
# function-calling = standard OpenAI-compatible tool calling loop
# =========================
agent.tool-calling.mode=${AGENT_TOOL_CALLING_MODE:function-calling}
agent.tool-calling.max-loop-rounds=${AGENT_TOOL_CALLING_MAX_LOOP_ROUNDS:5}
agent.tool-calling.dynamic-tool-selection-enabled=${AGENT_TOOL_CALLING_DYNAMIC_TOOL_SELECTION_ENABLED:true}
agent.tool-calling.max-selected-tools=${AGENT_TOOL_CALLING_MAX_SELECTED_TOOLS:6}
agent.tool-calling.compact-schema-enabled=${AGENT_TOOL_CALLING_COMPACT_SCHEMA_ENABLED:false}
agent.trace.diagnostic.api-key=${AGENT_TRACE_DIAGNOSTIC_API_KEY:}

# =========================
# WeChat memory
# =========================
wechat.memory.session-idle-minutes=${WECHAT_MEMORY_SESSION_IDLE_MINUTES:60}
wechat.memory.raw-retention-days=${WECHAT_MEMORY_RAW_RETENTION_DAYS:30}
wechat.memory.recent-turn-limit=${WECHAT_MEMORY_RECENT_TURN_LIMIT:10}
wechat.memory.rolling-summary-turn-threshold=${WECHAT_MEMORY_ROLLING_SUMMARY_TURN_THRESHOLD:20}
wechat.memory.summary-maintenance-initial-delay-ms=${WECHAT_MEMORY_SUMMARY_MAINTENANCE_INITIAL_DELAY_MS:60000}
wechat.memory.summary-maintenance-delay-ms=${WECHAT_MEMORY_SUMMARY_MAINTENANCE_DELAY_MS:300000}

# =========================
# WeChat Memory Graph context
# =========================
wechat.agent.context.memory-graph-enabled=${WECHAT_AGENT_CONTEXT_MEMORY_GRAPH_ENABLED:true}
wechat.agent.context.relevance-classifier-enabled=${WECHAT_AGENT_CONTEXT_RELEVANCE_CLASSIFIER_ENABLED:true}
wechat.agent.context.long-term-memory-ingestion-enabled=${WECHAT_AGENT_CONTEXT_LONG_TERM_MEMORY_INGESTION_ENABLED:true}
wechat.agent.context.strong-recent-turns=${WECHAT_AGENT_CONTEXT_STRONG_RECENT_TURNS:5}
wechat.agent.context.weak-recent-turns=${WECHAT_AGENT_CONTEXT_WEAK_RECENT_TURNS:1}
wechat.agent.context.min-recent-turns=${WECHAT_AGENT_CONTEXT_MIN_RECENT_TURNS:2}
wechat.agent.context.summary-window-size=${WECHAT_AGENT_CONTEXT_SUMMARY_WINDOW_SIZE:5}
wechat.agent.context.summary-overlap-turns=${WECHAT_AGENT_CONTEXT_SUMMARY_OVERLAP_TURNS:1}
wechat.agent.context.model-window-tokens=${WECHAT_AGENT_CONTEXT_MODEL_WINDOW_TOKENS:128000}
wechat.agent.context.output-reserve-tokens=${WECHAT_AGENT_CONTEXT_OUTPUT_RESERVE_TOKENS:8000}
wechat.agent.context.tool-loop-reserve-tokens=${WECHAT_AGENT_CONTEXT_TOOL_LOOP_RESERVE_TOKENS:12000}
wechat.agent.context.max-input-ratio=${WECHAT_AGENT_CONTEXT_MAX_INPUT_RATIO:0.8}
wechat.agent.context.fast-relevance-enabled=${WECHAT_AGENT_CONTEXT_FAST_RELEVANCE_ENABLED:true}
wechat.agent.context.semantic-compression-enabled=${WECHAT_AGENT_CONTEXT_SEMANTIC_COMPRESSION_ENABLED:false}

# =========================
# Reminder tasks / proactive WeChat notification
# =========================
reminder.default-timezone=${REMINDER_DEFAULT_TIMEZONE:Asia/Shanghai}
reminder.scheduler.enabled=${REMINDER_SCHEDULER_ENABLED:true}
reminder.scheduler.poll-interval-ms=${REMINDER_SCHEDULER_POLL_INTERVAL_MS:15000}
reminder.scheduler.batch-size=${REMINDER_SCHEDULER_BATCH_SIZE:20}
reminder.scheduler.lock-timeout-seconds=${REMINDER_SCHEDULER_LOCK_TIMEOUT_SECONDS:300}
reminder.delivery.max-retry-count=${REMINDER_DELIVERY_MAX_RETRY_COUNT:3}
reminder.delivery.retry-delay-seconds=${REMINDER_DELIVERY_RETRY_DELAY_SECONDS:60}

# =========================
# Patient care coordination backend
# Bootstrap is disabled unless CARE_BOOTSTRAP_KEY is explicitly configured.
# =========================
care.bootstrap-key=${CARE_BOOTSTRAP_KEY:}
care.session-ttl-hours=${CARE_SESSION_TTL_HOURS:12}
care.web.public-base-url=${CARE_WEB_PUBLIC_BASE_URL:${WECHAT_REPORT_PUBLIC_BASE_URL:${WECHAT_LOGIN_PAGE_BASE_URL:}}}
care.notification.enabled=${CARE_NOTIFICATION_ENABLED:true}
care.notification.poll-interval-ms=${CARE_NOTIFICATION_POLL_INTERVAL_MS:15000}
care.notification.batch-size=${CARE_NOTIFICATION_BATCH_SIZE:20}
care.notification.max-retry-count=${CARE_NOTIFICATION_MAX_RETRY_COUNT:3}
care.notification.retry-delay-seconds=${CARE_NOTIFICATION_RETRY_DELAY_SECONDS:60}
care.notification.lock-timeout-seconds=${CARE_NOTIFICATION_LOCK_TIMEOUT_SECONDS:300}
care.task.enabled=${CARE_TASK_ENABLED:true}
care.task.poll-interval-ms=${CARE_TASK_POLL_INTERVAL_MS:15000}
care.task.batch-size=${CARE_TASK_BATCH_SIZE:100}
care.task.generation-horizon-days=${CARE_TASK_GENERATION_HORIZON_DAYS:1}
care.task.max-postpone-minutes=${CARE_TASK_MAX_POSTPONE_MINUTES:1440}

# =========================
# Weather
# =========================
amap.weather.key=${AMAP_WEATHER_KEY:}
amap.weather.base-url=${AMAP_WEATHER_BASE_URL:https://restapi.amap.com}

# =========================
# Map
# AMAP_MAP_KEY can use the same Web service key as AMAP_WEATHER_KEY.
# =========================
amap.map.key=${AMAP_MAP_KEY:${AMAP_WEATHER_KEY:}}
amap.map.base-url=${AMAP_MAP_BASE_URL:https://restapi.amap.com}
amap.map.static-image-enabled=${AMAP_MAP_STATIC_IMAGE_ENABLED:true}

# =========================
# Didi MCP taxi and WeChat Pay
# =========================
didi.mcp.endpoint=${DIDI_MCP_ENDPOINT:https://mcp.didichuxing.com/mcp-servers}
didi.mcp.key=${DIDI_MCP_KEY:}
didi.mcp.timeout-ms=${DIDI_MCP_TIMEOUT_MS:15000}
didi.mcp.enabled=${DIDI_MCP_ENABLED:true}
ride.polling.enabled=${RIDE_POLLING_ENABLED:false}
wechat.pay.enabled=${WECHAT_PAY_ENABLED:false}
wechat.pay.app-id=${WECHAT_PAY_APP_ID:}
wechat.pay.mch-id=${WECHAT_PAY_MCH_ID:}
wechat.pay.api-v3-key=${WECHAT_PAY_API_V3_KEY:}
wechat.pay.private-key-path=${WECHAT_PAY_PRIVATE_KEY_PATH:}
wechat.pay.merchant-serial-number=${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
wechat.pay.platform-certificate-path=${WECHAT_PAY_PLATFORM_CERTIFICATE_PATH:}
wechat.pay.notify-url=${WECHAT_PAY_NOTIFY_URL:}

# =========================
# Food delivery gateway
# Connect this endpoint to an authorized delivery API or an isolated Playwright worker.
# =========================
food.delivery.enabled=${FOOD_DELIVERY_ENABLED:false}
food.delivery.base-url=${FOOD_DELIVERY_BASE_URL:}
food.delivery.api-key=${FOOD_DELIVERY_API_KEY:}
food.delivery.timeout-ms=${FOOD_DELIVERY_TIMEOUT_MS:20000}
food.delivery.eleme-h5-url=${FOOD_DELIVERY_ELEME_H5_URL:https://h5.ele.me}
food.delivery.address-encryption-key=${FOOD_DELIVERY_ADDRESS_ENCRYPTION_KEY:}

# =========================
# Meituan travel official CLI
# Windows automatically resolves the global npm shim to node.exe + ht-ai dist/index.js.
# =========================
meituan.travel.enabled=${MEITUAN_TRAVEL_ENABLED:false}
meituan.travel.token=${MEITUAN_HT_TOKEN:}
meituan.travel.executable=${MEITUAN_TRAVEL_EXECUTABLE:ht-ai}
meituan.travel.cli-script=${MEITUAN_TRAVEL_CLI_SCRIPT:}
meituan.travel.channel=${MEITUAN_TRAVEL_CHANNEL:meituan-developer}
meituan.travel.timeout-ms=${MEITUAN_TRAVEL_TIMEOUT_MS:125000}
meituan.travel.max-output-bytes=${MEITUAN_TRAVEL_MAX_OUTPUT_BYTES:2097152}

# =========================
# QQ email SMTP
# EMAIL_SMTP_PASSWORD must be a QQ Mail authorization code, not the QQ password.
# =========================
email.enabled=${EMAIL_ENABLED:false}
email.provider=${EMAIL_PROVIDER:qq}
email.smtp.host=${EMAIL_SMTP_HOST:smtp.qq.com}
email.smtp.port=${EMAIL_SMTP_PORT:465}
email.smtp.ssl-enabled=${EMAIL_SMTP_SSL_ENABLED:true}
email.smtp.username=${EMAIL_SMTP_USERNAME:}
email.smtp.password=${EMAIL_SMTP_PASSWORD:}
email.smtp.from=${EMAIL_FROM:${EMAIL_SMTP_USERNAME:}}
email.smtp.timeout-ms=${EMAIL_SMTP_TIMEOUT_MS:15000}
email.allowed-recipients=${EMAIL_ALLOWED_RECIPIENTS:}
email.require-confirmation-for-non-whitelist=${EMAIL_REQUIRE_CONFIRMATION_FOR_NON_WHITELIST:true}
email.pending-draft-ttl-minutes=${EMAIL_PENDING_DRAFT_TTL_MINUTES:10}
email.max-body-chars=${EMAIL_MAX_BODY_CHARS:8000}
email.host=${EMAIL_SMTP_HOST:smtp.qq.com}
email.port=${EMAIL_SMTP_PORT:465}
email.ssl=${EMAIL_SMTP_SSL:${EMAIL_SMTP_SSL_ENABLED:true}}
email.username=${EMAIL_USERNAME:${EMAIL_SMTP_USERNAME:}}
email.password=${EMAIL_PASSWORD:${EMAIL_SMTP_PASSWORD:}}
email.from=${EMAIL_FROM:${EMAIL_USERNAME:${EMAIL_SMTP_USERNAME:}}}
email.max-attachment-size-mb=${EMAIL_MAX_ATTACHMENT_SIZE_MB:25}
email.work-dir=${EMAIL_WORK_DIR:data/email/attachments}
email.receive-enabled=${EMAIL_RECEIVE_ENABLED:true}
email.imap-host=${EMAIL_IMAP_HOST:imap.qq.com}
email.imap-port=${EMAIL_IMAP_PORT:993}
email.imap-ssl=${EMAIL_IMAP_SSL:true}
email.query-limit=${EMAIL_QUERY_LIMIT:10}
email.query-scan-limit=${EMAIL_QUERY_SCAN_LIMIT:100}
email.attachment-download-dir=${EMAIL_ATTACHMENT_DOWNLOAD_DIR:data/downloads/email/attachments}
email.allowed-paths=${EMAIL_ALLOWED_PATHS:data/downloads,data/email/attachments,generated-files,generated-images,data/wechat/documents,data/wechat/images,data/wechat/videos}
email.pending-ttl=${EMAIL_PENDING_TTL:10m}

# Kuaidi100 logistics tracking
# =========================
kuaidi100.customer=${KUAIDI100_CUSTOMER:}
kuaidi100.key=${KUAIDI100_KEY:}
kuaidi100.base-url=${KUAIDI100_BASE_URL:https://poll.kuaidi100.com}

# =========================
# DashScope common / chat
# Keep openclaw.* aliases for compatibility with existing code.
# =========================
dashscope.api-key=${DASHSCOPE_API_KEY:}
dashscope.base-url=${DASHSCOPE_BASE_URL:}
openclaw.dashscope.model=${OPENCLAW_DASHSCOPE_MODEL:qwen3.7-max-2026-06-08}
dashscope.model=${DASHSCOPE_CHAT_MODEL:${openclaw.dashscope.model}}
dashscope.enable-thinking=${DASHSCOPE_ENABLE_THINKING:true}

# =========================
# Knowledge base / Qdrant / Embedding
# =========================
qdrant.host=${QDRANT_HOST:localhost}
qdrant.http-port=${QDRANT_HTTP_PORT:6333}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection=${QDRANT_COLLECTION:openclaw_knowledge}
qdrant.distance=${QDRANT_DISTANCE:Cosine}
qdrant.vector-size=${QDRANT_VECTOR_SIZE:0}
knowledge.chunk-size=${KNOWLEDGE_CHUNK_SIZE:800}
knowledge.chunk-overlap=${KNOWLEDGE_CHUNK_OVERLAP:120}
knowledge.top-k=${KNOWLEDGE_TOP_K:5}
knowledge.max-context-chars=${KNOWLEDGE_MAX_CONTEXT_CHARS:6000}
knowledge.min-score=${KNOWLEDGE_MIN_SCORE:0.2}
rag.enabled=${RAG_ENABLED:true}
rag.auto-retrieve=${RAG_AUTO_RETRIEVE:true}
rag.top-k=${RAG_TOP_K:${KNOWLEDGE_TOP_K:5}}
rag.min-score=${RAG_MIN_SCORE:${KNOWLEDGE_MIN_SCORE:0.2}}
rag.max-context-chars=${RAG_MAX_CONTEXT_CHARS:${KNOWLEDGE_MAX_CONTEXT_CHARS:6000}}
rag.include-sources=${RAG_INCLUDE_SOURCES:true}
dashscope.embedding.model=${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
dashscope.embedding.base-url=${DASHSCOPE_EMBEDDING_BASE_URL:${dashscope.base-url}}
dashscope.embedding.api-key=${DASHSCOPE_EMBEDDING_API_KEY:${dashscope.api-key}}

# =========================
# Web reading / search
# =========================
web.read.timeout-ms=${WEB_READ_TIMEOUT_MS:10000}
web.read.max-bytes=${WEB_READ_MAX_BYTES:2097152}
web.cache.ttl-hours=${WEB_CACHE_TTL_HOURS:24}
web.search.provider=${WEB_SEARCH_PROVIDER:none}
web.search.endpoint=${WEB_SEARCH_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp}
web.search.api-key=${WEB_SEARCH_API_KEY:${dashscope.api-key}}
web.search.limit=${WEB_SEARCH_LIMIT:5}

# =========================
# Xiaohongshu opinion monitoring
# Use a strong environment-specific secret in production.
# =========================
xhs.privacy.author-hash-key=${XHS_AUTHOR_HASH_KEY:openclaw-local-only}
xhs.collector.enabled=${XHS_COLLECTOR_ENABLED:false}
xhs.collector.base-url=${XHS_COLLECTOR_BASE_URL:}
xhs.collector.api-key=${XHS_COLLECTOR_API_KEY:}
xhs.collector.timeout=${XHS_COLLECTOR_TIMEOUT:20s}
xhs.collector.claim-timeout=${XHS_COLLECTOR_CLAIM_TIMEOUT:5m}
xhs.collector.polling-delay=${XHS_COLLECTOR_POLLING_DELAY:10s}
xhs.collector.max-attempts=${XHS_COLLECTOR_MAX_ATTEMPTS:30}
xhs.analysis.enabled=${XHS_ANALYSIS_ENABLED:false}
xhs.analysis.version=${XHS_ANALYSIS_VERSION:xhs-opinion-v1}
xhs.analysis.batch-size=${XHS_ANALYSIS_BATCH_SIZE:20}
xhs.analysis.minimum-incident-risk-score=${XHS_MINIMUM_INCIDENT_RISK_SCORE:60}
xhs.analysis.review-confidence-threshold=${XHS_REVIEW_CONFIDENCE_THRESHOLD:0.65}
xhs.analysis.polling-delay=${XHS_ANALYSIS_POLLING_DELAY:15s}
xhs.analysis.model=${XHS_ANALYSIS_MODEL:qwen-plus}
xhs.analysis.max-output-tokens=${XHS_ANALYSIS_MAX_OUTPUT_TOKENS:450}
xhs.analysis.claim-timeout=${XHS_ANALYSIS_CLAIM_TIMEOUT:15m}
xhs.alert.enabled=${XHS_ALERT_ENABLED:false}
xhs.alert.max-delivery-attempts=${XHS_ALERT_MAX_DELIVERY_ATTEMPTS:3}
xhs.alert.batch-size=${XHS_ALERT_BATCH_SIZE:20}
xhs.alert.claim-timeout=${XHS_ALERT_CLAIM_TIMEOUT:2m}
xhs.alert.polling-delay=${XHS_ALERT_POLLING_DELAY:10s}
xhs.scheduled-report.enabled=${XHS_SCHEDULED_REPORT_ENABLED:true}
xhs.scheduled-report.storage-dir=${XHS_REPORT_STORAGE_DIR:data/xhs/reports}
xhs.scheduled-report.polling-delay=${XHS_REPORT_POLLING_DELAY:10s}
xhs.scheduled-report.collection-wait=${XHS_REPORT_COLLECTION_WAIT:15m}
xhs.scheduled-report.analysis-wait=${XHS_REPORT_ANALYSIS_WAIT:10m}
xhs.scheduled-report.max-delivery-attempts=${XHS_REPORT_MAX_DELIVERY_ATTEMPTS:3}
xhs.scheduled-report.retention-days=${XHS_REPORT_RETENTION_DAYS:30}
xhs.scheduled-report.claim-timeout=${XHS_REPORT_CLAIM_TIMEOUT:15m}
xhs.scheduled-report.delivery-claim-timeout=${XHS_REPORT_DELIVERY_CLAIM_TIMEOUT:5m}
xhs.scheduled-report.cleanup-delay=${XHS_REPORT_CLEANUP_DELAY:1h}

# =========================
# DashScope vision / image generation
# =========================
dashscope.vision-model=${DASHSCOPE_VISION_MODEL:qwen3.7-plus}
dashscope.image-base-url=${DASHSCOPE_IMAGE_BASE_URL:}
openclaw.dashscope.image-model=${OPENCLAW_DASHSCOPE_IMAGE_MODEL:qwen-image-2.0-pro}
dashscope.image-model=${DASHSCOPE_IMAGE_MODEL:${openclaw.dashscope.image-model}}
dashscope.image-size=${DASHSCOPE_IMAGE_SIZE:1024*1024}
dashscope.image-watermark=${DASHSCOPE_IMAGE_WATERMARK:false}
dashscope.image-prompt-extend=${DASHSCOPE_IMAGE_PROMPT_EXTEND:true}
image.output-dir=${IMAGE_OUTPUT_DIR:generated-images}
wechat.image.storage-dir=${WECHAT_IMAGE_STORAGE_DIR:data/wechat/images}
wechat.image.batch-size=${WECHAT_IMAGE_BATCH_SIZE:5}
wechat.document.storage-dir=${WECHAT_DOCUMENT_STORAGE_DIR:data/downloads/wechat/documents}

# =========================
# WeChat HTML reports
# =========================
wechat.report.enabled=${WECHAT_REPORT_ENABLED:true}
wechat.report.storage-dir=${WECHAT_REPORT_STORAGE_DIR:data/reports}
wechat.report.public-base-url=${WECHAT_REPORT_PUBLIC_BASE_URL:${WECHAT_LOGIN_PAGE_BASE_URL:}}
wechat.report.ttl=${WECHAT_REPORT_TTL:48h}
